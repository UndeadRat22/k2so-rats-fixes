[mod-setting-description]
k2so-rats-fixes-asteroid-radiation-immunity=Target kr-radioactive resistance applied to every asteroid. Auto keeps Krastorio 2 Spaced Out's 100% immunity, or uses 50% when eRisel-k2-arsenal (which adds kr-radioactive weapons) is installed.
k2so-rats-fixes-greenhouse-plus-k2-glass=When k2-greenhouse-plus provides its own sand and glass (its default), unify them with Krastorio 2's identical chain instead: greenhouses are built from kr-glass, and the duplicate k2gp-sand/k2gp-glass recipes and items are removed from play. Only applies when Krastorio 2 is installed; ignored otherwise.
